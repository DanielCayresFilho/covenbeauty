services:
  postgres:
    image: postgres:17-alpine
    container_name: coven_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coven_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-coven_beauty}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - coven_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coven} -d ${POSTGRES_DB:-coven_beauty}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coven_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - coven_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coven_pgdata:
  coven_redisdata:
